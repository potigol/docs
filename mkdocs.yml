site_name: "Linguagem Potigol"
site_url: "https://potigol.github.io/docs"
site_description: "Documentação da Linguagem Potigol"
theme:
  name: material
  language: pt-BR
  palette:
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange

    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple
  font:
    text: Roboto
    code: Source Code Pro

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/potigol
    - icon: material/twitter
      link: https://twitter.com/potigol

